[package]
name = "gldt_swap_integration_tests"
version = "0.1.0"
edition = "2021"

[dependencies]
assert_matches = { workspace = true }
bytes = "1.10.1"
serde = { workspace = true, features = ["derive"] }
serde_bytes = { workspace = true }
serde_json = { workspace = true }
rand = "0.9.1"
lazy_static = "1.4.0"
hex = "0.4"
sha2 = "0.10.8"
tempfile = "3.20.0"
http = "1.3.1"
url = "2.5.4"
