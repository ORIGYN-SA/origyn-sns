# NodeJS & NextJS job template

.node template:
  image: node:18
  cache:
  - key:
      files:
        - package-lock.json
    paths:
      - .npm/
      - node_modules/
      - frontend/**/.npm/
      - frontend/**/node_modules/
  before_script:
    # .npmrc resolves @origyn/shared-ui from the shared-ui GitLab package
    # registry (anonymous pull — no token needed).
    - npm ci --cache .npm --prefer-offline
  variables:
    # The scheduler reserves the request, not the limit. With 2Gi, three of
    # these jobs fit on the single runner node (7.2 GiB) at the same time.
    KUBERNETES_MEMORY_LIMIT: "5Gi"
    KUBERNETES_MEMORY_REQUEST: "2Gi"
