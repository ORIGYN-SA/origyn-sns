# NodeJS & NextJS job template

.node template:
  image: node:18
  cache:
  - key:
      files:
        - package-lock.json
    paths:
      - .npm/
      - node_modules/
      - frontend/**/.npm/
      - frontend/**/node_modules/
  before_script:
    - npm ci --cache .npm --prefer-offline
  variables:
    KUBERNETES_MEMORY_LIMIT: "5Gi"
    KUBERNETES_MEMORY_REQUEST: "5Gi"
