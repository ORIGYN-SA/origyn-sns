# Rust unit tests
#
# One job for the whole workspace. With one job per canister every job compiled
# the shared dependencies again, and `cargo test -p <canister>` never ran the
# tests of the crates under backend/libraries and backend/external_canisters.
# The integration tests have their own jobs (.integration_tests.yml).

rust unit tests:
  stage: test
  extends: .rust template
  variables:
    # The scheduler reserves the request, not the limit. The runner node has
    # 7.2 GiB and 3.7 cores, so the request decides how many jobs fit on it.
    KUBERNETES_MEMORY_REQUEST: "2Gi"
    KUBERNETES_MEMORY_LIMIT: "5Gi"
    KUBERNETES_CPU_REQUEST: "1"
    KUBERNETES_CPU_LIMIT: "2"
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes: &rust_unit_test_changes
        - "Cargo.{lock,toml}"
        - "rust-toolchain"
        - "backend/libraries/**/*.{rs,toml,did}"
        - "backend/external_canisters/**/*.{rs,toml,did}"
        - "backend/canisters/**/*.{rs,toml,did}"
        - "scripts/ci-cd/.canister_unit_test_coverage.yml"
    - if: $CI_COMMIT_REF_NAME == "develop"
      changes: *rust_unit_test_changes
  script:
    - cargo test --workspace --exclude integration_tests
