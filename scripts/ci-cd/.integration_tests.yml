integration tests trigger:
  stage: integration_testing
  rules:
    # This will run on any MR to develop
    - if: $CI_PIPELINE_SOURCE == "merge_request_event" &&
          $CI_MERGE_REQUEST_TARGET_BRANCH_NAME == "develop"
      changes:
        - "backend/libraries/**/*.{rs,toml,lock,md,did,wasm,gz}"
        - "backend/external_canisters/**/*.{rs,toml,lock,md,did,wasm,gz}"
        - "backend/canisters/**/*.{rs,toml,lock,md,did,wasm,gz}"
        - "backend/integration_testing/**/*.{rs,toml,lock,md,did,wasm,gz}"
      when: manual
  script:
    - echo "Running integration tests"

integration tests:
  stage: integration_testing
  variables:
    KUBERNETES_MEMORY_LIMIT: "5Gi"
    KUBERNETES_MEMORY_REQUEST: "5Gi"
    KUBERNETES_CPU_LIMIT: "2"
    KUBERNETES_CPU_REQUEST: "1"
  rules:
    - if: >
        $CI_COMMIT_TAG =~ '/^[a-zA-Z0-9_]+-v\d+\.\d+\.\d+(-reinstall)?$/' &&
        $CI_COMMIT_TAG !~ '/gld_dashboard|gld_landing_page|gldt_swap_app/'
      when: always
    # This will run on any MR to develop
    - if: $CI_PIPELINE_SOURCE == "merge_request_event" &&
          $CI_MERGE_REQUEST_TARGET_BRANCH_NAME == "develop"
      changes:
        - "backend/libraries/**/*.{rs,toml,lock,md,did,wasm,gz}"
        - "backend/external_canisters/**/*.{rs,toml,lock,md,did,wasm,gz}"
        - "backend/canisters/**/*.{rs,toml,lock,md,did,wasm,gz}"
        - "backend/integration_testing/**/*.{rs,toml,lock,md,did,wasm,gz}"
  needs:
    [
      "ogy_token_swap integration-test build",
      "canister_jobs integration-test build",
      "collection_index integration-test build",
      "sns_rewards integration-test build",
      "dex_interaction integration-test build",
      "sns_neuron_controller integration-test build",
    ]
  extends: .rust template
  script:
    - wget -O pocket-ic.gz https://github.com/dfinity/pocketic/releases/download/9.0.1/pocket-ic-x86_64-linux.gz
    - gzip -d pocket-ic.gz
    - chmod +x ./pocket-ic
    - mv ./pocket-ic ./backend/integration_tests/pocket-ic
    - ulimit -n 809600
    - ulimit -f 8096000
    - cargo test -p integration_tests

# gldt_swap is a standalone Cargo workspace (see backend/canisters/gldt_swap/Cargo.toml),
# so its integration tests run separately with the PocketIC version matching its pocket-ic crate.
gldt_swap integration tests:
  stage: integration_testing
  variables:
    KUBERNETES_MEMORY_LIMIT: "5Gi"
    KUBERNETES_MEMORY_REQUEST: "5Gi"
    KUBERNETES_CPU_LIMIT: "2"
    KUBERNETES_CPU_REQUEST: "1"
  rules:
    - if: >
        $CI_COMMIT_TAG =~ '/^gldt_swap-v\d+\.\d+\.\d+(-reinstall)?$/'
      when: always
    # This will run on any MR to develop
    - if: $CI_PIPELINE_SOURCE == "merge_request_event" &&
          $CI_MERGE_REQUEST_TARGET_BRANCH_NAME == "develop"
      changes:
        - "backend/canisters/gldt_swap/**/*.{rs,toml,lock,md,did,wasm,gz}"
  needs: ["gldt_swap integration-test build"]
  extends: .rust template
  script:
    - wget -O pocket-ic.gz https://github.com/dfinity/pocketic/releases/download/9.0.1/pocket-ic-x86_64-linux.gz
    - gzip -d pocket-ic.gz
    - chmod +x ./pocket-ic
    - export POCKET_IC_BIN="$CI_PROJECT_DIR/pocket-ic"
    - ulimit -n 809600
    - ulimit -f 8096000
    - cargo test --manifest-path backend/canisters/gldt_swap/Cargo.toml -p gldt_swap_integration_tests
