spec:
  inputs:
    src-folder:
      description: Name of the source folder, should be the same as the canister's cargo package name.
      options:
        [
          "ogy_token_swap",
          "sns_rewards",
          "sns_neuron_controller",
          "dex_interaction",
          "token_metrics",
          "canister_jobs",
          "collection_index",
          "gldt_swap"
        ]
---
# Rust canisters deployments

$[[ inputs.src-folder ]] staging deploy:
  stage: deploy
  interruptible: false
  resource_group: staging
  rules:
    # Targeted reinstall: deploy only the canister named by REINSTALL_STAGING (or
    # "all"), regardless of changed files. Guarded to non-tag pipelines so it can
    # never run on a production release tag.
    - if: ($REINSTALL_STAGING == "$[[ inputs.src-folder ]]" || $REINSTALL_STAGING == "all") && $CI_COMMIT_TAG == null
    # A reinstall is targeted at a different canister: skip this deploy entirely.
    - if: $REINSTALL_STAGING
      when: never
    # Same list as the develop rule of the staging build.
    - if: $CI_COMMIT_REF_NAME == "develop" && $CI_PIPELINE_SOURCE != "merge_request_event" # deployment when merged to develop
      changes:
        - "backend/libraries/**/*.{rs,toml,lock,md,did,wasm,gz}"
        - "backend/external_canisters/**/*.{rs,toml,lock,md,did,wasm,gz}"
        - "backend/canisters/$[[ inputs.src-folder ]]/**/*.{rs,toml,lock,md,did,wasm,gz}"
    - if: $CI_PIPELINE_SOURCE == "merge_request_event" && $CI_COMMIT_REF_NAME != "develop" # deployment when trigger manually on MR
      changes:
        - "backend/canisters/$[[ inputs.src-folder ]]/**/*.{rs,toml,lock,md,did,wasm,gz}"
      allow_failure: true
      when: manual
  needs:
    ["$[[ inputs.src-folder ]] staging build"]
    # ["$[[ inputs.src-folder ]] staging build", "integration tests"]
  variables:
    TARGET_NETWORK: staging
    PEM_FILE: "${PEM_FILE_STAGING}"
    # To wipe state and reinstall instead of upgrade on staging, run a pipeline
    # with the CI/CD variable REINSTALL_STAGING set to this canister's name
    # (e.g. "token_metrics") or to "all". Only the named canister(s) build and
    # deploy; all other canisters are skipped (see the rules above). Production
    # (ic) is never affected: it reinstalls only via a "<canister>-vX.Y.Z-reinstall" tag.
  before_script:
    - !reference [.import dfx identity, before_script]
  script:
    - . scripts/canister-deploy/deploy-$[[ inputs.src-folder ]].sh $TARGET_NETWORK
  environment:
    name: staging/$[[ inputs.src-folder ]]
    deployment_tier: staging
    action: start

$[[ inputs.src-folder ]] production deploy:
  stage: deploy
  interruptible: false
  resource_group: production
  rules:
    - if: $CI_COMMIT_TAG =~ '/^$[[ inputs.src-folder ]]-v\d+\.\d+\.\d+(-reinstall)?$/'
      changes:
        - "backend/libraries/**/*.{rs,toml,lock,md,did,wasm,gz}"
        - "backend/external_canisters/**/*.{rs,toml,lock,md,did,wasm,gz}"
        - "backend/canisters/$[[ inputs.src-folder ]]/**/*.{rs,toml,lock,md,did,wasm,gz}"
      when: manual
  variables:
    TARGET_NETWORK: ic
    PEM_FILE: "${PEM_FILE_PRODUCTION}"
  # needs: ["$[[ inputs.src-folder ]] production build", "integration tests"]
  before_script:
    - !reference [.import dfx identity, before_script]
    # a canister script can encode its upgrade argument with the Candid types (deploy-gldt_swap.sh)
    - !reference [.include didc, before_script]
  script:
    - . scripts/canister-deploy/deploy-$[[ inputs.src-folder ]].sh $TARGET_NETWORK
  environment:
    name: production/$[[ inputs.src-folder ]]
    deployment_tier: production
    action: start

$[[ inputs.src-folder ]] github release:
  stage: deploy
  interruptible: false
  resource_group: github_release
  rules:
    - if: $CI_COMMIT_TAG =~ '/^$[[ inputs.src-folder ]]-v\d+\.\d+\.\d+(-reinstall)?$/'
      changes:
        - "backend/libraries/**/*.{rs,toml,lock,md,did,wasm,gz}"
        - "backend/external_canisters/**/*.{rs,toml,lock,md,did,wasm,gz}"
        - "backend/canisters/$[[ inputs.src-folder ]]/**/*.{rs,toml,lock,md,did,wasm,gz}"
      when: manual
    # - if: $CI_PIPELINE_SOURCE == "merge_request_event" && $CI_COMMIT_REF_NAME != "develop" # FOR TESTING ONLY, REMOVE AFTERWARDS!!!!
    #   changes:
    #     - "backend/canisters/$[[ inputs.src-folder ]]/**/*.{rs,toml,lock,md,did,wasm,gz}"
    #   when: manual
  needs: ["$[[ inputs.src-folder ]] production build"]
  # GITHUB_TOKEN and GITHUB_REPO (<owner>/<repo>) come from the CI/CD variables
  # of the project. They only need to reach this job: protected, and with the
  # environment scope "github_release".
  before_script:
    - apt-get update && apt-get install -y curl jq
  script:
    - |
      if [ -z "$GITHUB_TOKEN" ] || [ -z "$GITHUB_REPO" ]; then
        echo "GITHUB_TOKEN or GITHUB_REPO is not set, see the comment on this job in scripts/ci-cd/.canister_deploys.yml"
        exit 1
      fi

      SRC_FOLDER="$[[ inputs.src-folder ]]"
      WASM_PATH="backend/canisters/${SRC_FOLDER}/target/wasm32-unknown-unknown/release/${SRC_FOLDER}_canister.wasm.gz"
      DID_PATH="backend/canisters/${SRC_FOLDER}/api/can.did"

      if [ ! -f "$WASM_PATH" ]; then
        echo "Wasm file not found: $WASM_PATH"
        exit 1
      fi

      if [ ! -f "$DID_PATH" ]; then
        echo "DID file not found: $DID_PATH — skipping DID upload"
        HAS_DID=false
      else
        HAS_DID=true
      fi

      RELEASE_NAME="Release $CI_COMMIT_TAG"

      # --fail-with-body: an error answer of GitHub fails the job and is shown.
      # Without it curl exits with 0 and the job went on with an empty upload URL.
      RELEASE_RESPONSE=$(curl -sS --fail-with-body -X POST \
        -H "Authorization: token $GITHUB_TOKEN" \
        -H "Accept: application/vnd.github.v3+json" \
        "https://api.github.com/repos/$GITHUB_REPO/releases" \
        -d "{
          \"tag_name\": \"$CI_COMMIT_TAG\",
          \"name\": \"$RELEASE_NAME\",
          \"body\": \"Release automatic from GitLab CI\",
          \"draft\": false,
          \"prerelease\": false
        }") || { echo "GitHub did not create the release:"; echo "$RELEASE_RESPONSE"; exit 1; }

      UPLOAD_URL=$(echo "$RELEASE_RESPONSE" | jq -r '.upload_url // empty' | sed 's/{?name,label}//')
      if [ -z "$UPLOAD_URL" ]; then
        echo "The answer of GitHub has no upload_url:"
        echo "$RELEASE_RESPONSE"
        exit 1
      fi

      echo "Uploading $WASM_PATH..."
      curl -sS --fail-with-body -X POST \
        -H "Authorization: token $GITHUB_TOKEN" \
        -H "Content-Type: application/octet-stream" \
        --data-binary @"$WASM_PATH" \
        "$UPLOAD_URL?name=${SRC_FOLDER}_canister.wasm.gz"

      if [ "$HAS_DID" = true ]; then
        echo "Uploading $DID_PATH..."
        curl -sS --fail-with-body -X POST \
          -H "Authorization: token $GITHUB_TOKEN" \
          -H "Content-Type: application/octet-stream" \
          --data-binary @"$DID_PATH" \
          "$UPLOAD_URL?name=can.did"
      fi
  environment:
    name: github_release
    deployment_tier: production
    action: start
