spec:
  inputs:
    src-folder:
      description: The frontend workspace folder. Must be located in the /frontend/ folder
      options:
        [
        "ogy_dashboard",
        "origyn_landing_page",
        "shared"
        ]
---
# Front-end linter job template

$[[ inputs.src-folder ]] linter:
  stage: lint
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes:
        - "frontend/$[[ inputs.src-folder ]]/*.{js,json}"
        - "frontend/$[[ inputs.src-folder ]]/{**,**/**,**/**/**}/*.{js,jsx,ts,tsx,md,mdx,css,html,svg}"
    - if: $CI_OPEN_MERGE_REQUESTS
      when: never
      changes:
        - "frontend/$[[ inputs.src-folder ]]/*.{js,json}"
        - "frontend/$[[ inputs.src-folder ]]/{**,**/**,**/**/**}/*.{js,jsx,ts,tsx,md,mdx,css,html,svg}"
    - if: $CI_COMMIT_REF_NAME == "develop"
      changes:
        - "frontend/$[[ inputs.src-folder ]]/*.{js,json}"
        - "frontend/$[[ inputs.src-folder ]]/{**,**/**,**/**/**}/*.{js,jsx,ts,tsx,md,mdx,css,html,svg}"
  extends: .node template
  script:
    # Resolve by workspace path so it works regardless of the package name
    # (e.g. the "shared" folder is the @origyn/shared package).
    - npm run --workspace frontend/$[[ inputs.src-folder ]] lint
