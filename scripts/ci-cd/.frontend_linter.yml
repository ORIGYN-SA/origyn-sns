spec:
  inputs:
    src-folder:
      description: The frontend workspace folder. Must be located in the /frontend/ folder
      options:
        [
        "ogy_dashboard",
        "origyn_landing_page"
        ]
---
# Front-end linter job template
#
# The "changes" lists name the whole app folder and the files the npm
# workspaces share. A list of file extensions misses things that change the
# build, such as .env.production, stylesheets, images and the lockfile.

$[[ inputs.src-folder ]] linter:
  stage: lint
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes:
        - "frontend/$[[ inputs.src-folder ]]/**/*"
        - "package.json"
        - "package-lock.json"
        - ".npmrc"
        # A change to the job itself (for example the Node version) is tried
        # on its merge request
        - "scripts/ci-cd/.{node_template,frontend_linter}.yml"
    - if: $CI_COMMIT_REF_NAME == "develop"
      changes:
        - "frontend/$[[ inputs.src-folder ]]/**/*"
        - "package.json"
        - "package-lock.json"
        - ".npmrc"
  extends: .node template
  script:
    # Resolve by workspace path so it works regardless of the package name
    - npm run --workspace frontend/$[[ inputs.src-folder ]] lint
