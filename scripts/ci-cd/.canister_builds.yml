spec:
  inputs:
    src-folder:
      description: Name of the source folder, should be the same as the canister's cargo package name.
      options:
        [
          "ogy_token_swap",
          "sns_rewards",
          "sns_neuron_controller",
          "dex_interaction",
          "token_metrics",
          "canister_jobs",
          "collection_index",
          "gldt_swap",
        ]
---
# Rust canisters builds
$[[ inputs.src-folder ]] staging build:
  extends: .rust template
  stage: build
  rules:
    # Targeted reinstall: build only the canister named by REINSTALL_STAGING (or
    # "all"), regardless of changed files, so a single canister can be reinstalled
    # on staging without rebuilding everything. Guarded to non-tag pipelines.
    - if: ($REINSTALL_STAGING == "$[[ inputs.src-folder ]]" || $REINSTALL_STAGING == "all") && $CI_COMMIT_TAG == null
    # A reinstall is targeted at a different canister: skip this build entirely.
    - if: $REINSTALL_STAGING
      when: never
    # - if: $CI_MERGE_REQUEST_TARGET_BRANCH_NAME == "master"
    #   when: never
    # Not on a merge request from develop: the staging deploy does not run
    # there, so nothing would use the build.
    - if: $CI_COMMIT_REF_NAME == "develop" && $CI_PIPELINE_SOURCE != "merge_request_event"
      changes:
        - "backend/canisters/$[[ inputs.src-folder ]]/**/*.{rs,toml,lock,md,did,wasm,gz}"
    - if: $CI_PIPELINE_SOURCE == "merge_request_event" && $CI_COMMIT_REF_NAME != "develop"
      changes:
        - "backend/canisters/$[[ inputs.src-folder ]]/**/*.{rs,toml,lock,md,did,wasm,gz}"
      allow_failure: true
  script:
    - scripts/build-canister.sh --wasmonly $[[ inputs.src-folder ]]
    - scripts/generate-did.sh $[[ inputs.src-folder ]]
    - scripts/build-canister.sh --checksum $[[ inputs.src-folder ]]
    - ic-wasm backend/canisters/$[[ inputs.src-folder ]]/target/wasm32-unknown-unknown/release/$[[ inputs.src-folder ]]_canister.wasm info
  artifacts:
    name: "${CI_PROJECT_NAME}-$[[ inputs.src-folder ]]-${CI_COMMIT_REF_SLUG}-${CI_COMMIT_SHORT_SHA}-wasm-STAGING"
    paths:
      - backend/canisters/$[[ inputs.src-folder ]]/target/wasm32-unknown-unknown/release/$[[ inputs.src-folder ]]_canister.wasm
      - backend/canisters/$[[ inputs.src-folder ]]/target/wasm32-unknown-unknown/release/$[[ inputs.src-folder ]]_canister.wasm.gz
      - backend/canisters/$[[ inputs.src-folder ]]/api/can.did
    expire_in: 1 day

$[[ inputs.src-folder ]] production build:
  extends: .rust template
  stage: build
  rules:
    - if: $CI_COMMIT_REF_NAME =~ '/^$[[ inputs.src-folder ]]-v\d+\.\d+\.\d+(-reinstall)?$/'
  script:
    - scripts/build-canister.sh --wasmonly $[[ inputs.src-folder ]]
    - scripts/generate-did.sh $[[ inputs.src-folder ]]
    - scripts/build-canister.sh --checksum $[[ inputs.src-folder ]]
    - ic-wasm backend/canisters/$[[ inputs.src-folder ]]/target/wasm32-unknown-unknown/release/$[[ inputs.src-folder ]]_canister.wasm info
  artifacts:
    name: "${CI_PROJECT_NAME}-$[[ inputs.src-folder ]]-${CI_COMMIT_REF_SLUG}-${CI_COMMIT_SHORT_SHA}-wasm"
    paths:
      - backend/canisters/$[[ inputs.src-folder ]]/target/wasm32-unknown-unknown/release/$[[ inputs.src-folder ]]_canister.wasm
      - backend/canisters/$[[ inputs.src-folder ]]/target/wasm32-unknown-unknown/release/$[[ inputs.src-folder ]]_canister.wasm.gz
      - backend/canisters/$[[ inputs.src-folder ]]/api/can.did
    expire_in: 6 months

# The integration-test build of all canisters is one job, see .integration_tests.yml
