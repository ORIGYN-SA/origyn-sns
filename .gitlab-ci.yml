  environment:
    name: staging/origyn_landing_page
    deployment_tier: staging
    url: https://ujkle-wiaaa-aaaap-qhxsa-cai.icp0.io/
    action: start

ogy landing page production:
  stage: deploy
  interruptible: false
  resource_group: frontend production deployment
  variables:
    CANISTER_NAME: "origyn_landing_page"
  rules:
    - if: $CI_COMMIT_TAG =~ '/^origyn_landing_page-v\d+\.\d+\.\d+$/'
