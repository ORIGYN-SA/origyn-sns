default:
  image: dckreg.bity.com/bity/dev/runners_images/dfinity-canisters:0.31.0
  # A newer pipeline on the same ref may cancel running jobs. Every job of the
  # deploy stage sets "interruptible: false", so a deploy is never cut off half
  # way (a canister upgrade is stop, install, start).
  interruptible: true
  before_script:
    - dfx --version
  retry:
    max: 2
    when:
      - runner_system_failure
      - stuck_or_timeout_failure
      - api_failure
      - runner_unsupported
      - unknown_failure

# A merge request from develop (the release merge request to master) gets no
# pipeline of its own. Its commit has just been linted, tested and built by the
# branch pipeline of develop, and GitLab shows that pipeline on the merge
# request.
workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event" && $CI_MERGE_REQUEST_SOURCE_BRANCH_NAME == "develop"
      when: never
    - when: always

stages:
  - preparation
  - lint
  - build
  - test
  - integration_testing
  - deploy

include:
  # Templates:
  - local: scripts/ci-cd/.node_template.yml
  - local: scripts/ci-cd/.rust_template.yml
  # Frontend linters:
  - local: scripts/ci-cd/.frontend_linter.yml
    inputs:
      src-folder: ogy_dashboard
  - local: scripts/ci-cd/.frontend_linter.yml
    inputs:
      src-folder: origyn_landing_page

################################################################################
# Unit Tests
################################################################################
  # One job for the whole workspace
  - local: scripts/ci-cd/.canister_unit_test_coverage.yml

################################################################################
# Canister Builds
################################################################################
  - local: scripts/ci-cd/.canister_builds.yml
    inputs:
      src-folder: ogy_token_swap
  - local: scripts/ci-cd/.canister_builds.yml
    inputs:
      src-folder: sns_rewards
  - local: scripts/ci-cd/.canister_builds.yml
    inputs:
      src-folder: collection_index
  - local: scripts/ci-cd/.canister_builds.yml
    inputs:
      src-folder: sns_neuron_controller
  - local: scripts/ci-cd/.canister_builds.yml
    inputs:
      src-folder: dex_interaction
  - local: scripts/ci-cd/.canister_builds.yml
    inputs:
      src-folder: canister_jobs
  - local: scripts/ci-cd/.canister_builds.yml
    inputs:
      src-folder: gldt_swap

  # Canister generate declaration
  # - local: scripts/ci-cd/.generate_declaration.yml
  #   inputs:
  #     src-folder: ogy_token_swap
  # - local: scripts/ci-cd/.generate_declaration.yml
  #   inputs:
  #     src-folder: sns_rewards
  # - local: scripts/ci-cd/.generate_declaration.yml
  #   inputs:
  #     src-folder: sns_neuron_controller
  # - local: scripts/ci-cd/.generate_declaration.yml
  #   inputs:
  #     src-folder: canister_jobs

################################################################################
# Frontend Builds preparation
################################################################################
  - local: scripts/ci-cd/.frontend_builds.yml
    inputs:
      src-folder: ogy_dashboard
  - local: scripts/ci-cd/.frontend_builds.yml
    inputs:
      src-folder: origyn_landing_page
  # gldt_swap_app is a standalone pnpm project: linter, builds and deployments
  - local: scripts/ci-cd/.gldt_swap_app.yml

################################################################################
# Integration Tests
################################################################################
  - local: scripts/ci-cd/.integration_tests.yml

################################################################################
# Backend deployments
################################################################################
  - local: scripts/ci-cd/.canister_deploys.yml
    inputs:
      src-folder: ogy_token_swap
  - local: scripts/ci-cd/.canister_deploys.yml
    inputs:
      src-folder: sns_rewards
  - local: scripts/ci-cd/.canister_deploys.yml
    inputs:
      src-folder: sns_neuron_controller
  - local: scripts/ci-cd/.canister_deploys.yml
    inputs:
      src-folder: dex_interaction
  - local: scripts/ci-cd/.canister_deploys.yml
    inputs:
      src-folder: canister_jobs
  - local: scripts/ci-cd/.canister_deploys.yml
    inputs:
      src-folder: collection_index
  - local: scripts/ci-cd/.canister_deploys.yml
    inputs:
      src-folder: gldt_swap
  # Deployments
  - local: scripts/ci-cd/.dfx_templates.yml

################################################################################
# Linters
################################################################################

rust lint:
  stage: lint
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes:
        - "Cargo.{lock,toml}"
        - "backend/{**,**/**,**/**/**}/*.{rs,toml,lock}"
    - if: $CI_COMMIT_REF_NAME == "develop"
      changes:
        - "Cargo.{lock,toml}"
        - "backend/{**,**/**,**/**/**}/*.{rs,toml,lock}"
  extends: .rust template
  script:
    - cargo clippy

#######
# DEPLOYMENTS FRONTEND
#######
# The production jobs have no "changes" list: GitLab evaluates "changes" to
# true on every tag pipeline, so it never filtered anything there.
#
# Every deploy job, frontend or backend, has an environment of its own named
# "<tier>/<canister>" (staging/, preprod/, production/). The production key and
# proposer neuron (PEM_FILE_PRODUCTION, SNS_PROPOSER_NEURON_ID_PRODUCTION) can
# then be limited to the environment scope "production/*" in the GitLab
# settings, so only the production deploy jobs receive them. Build jobs must
# keep environment names outside "production/".

ogy dashboard staging:
  stage: deploy
  interruptible: false
  resource_group: frontend staging deployment
  variables:
    CANISTER_NAME: "ogy_dashboard"
  rules:
    - if: $CI_COMMIT_REF_NAME == "develop" && $CI_PIPELINE_SOURCE != "merge_request_event"
      changes:
        - "frontend/ogy_dashboard/**/*"
        - "package.json"
        - "package-lock.json"
        - ".npmrc"
      needs: ["ogy_dashboard staging build"]
      variables:
        TARGET_NETWORK: staging
        PEM_FILE: "${PEM_FILE_STAGING}"
  before_script:
    - !reference [.import dfx identity, before_script]
  script:
    - !reference [.asset canister staging deploy, script]
  environment:
    name: staging/ogy_dashboard
    deployment_tier: staging
    url: https://7ekbt-siaaa-aaaag-ak64a-cai.icp0.io/
    action: start

ogy dashboard preprod:
  stage: deploy
  interruptible: false
  resource_group: frontend staging deployment
  variables:
    CANISTER_NAME: "ogy_dashboard"
  rules:
    - if: $CI_COMMIT_REF_NAME == "develop" && $CI_PIPELINE_SOURCE != "merge_request_event"
      changes:
        - "frontend/ogy_dashboard/**/*"
        - "package.json"
        - "package-lock.json"
        - ".npmrc"
      needs: ["ogy_dashboard preprod build"]
      variables:
        TARGET_NETWORK: preprod
        PEM_FILE: "${PEM_FILE_STAGING}"
  before_script:
    - !reference [.import dfx identity, before_script]
  script:
    - !reference [.asset canister preprod deploy, script]
  environment:
    name: preprod/ogy_dashboard
    deployment_tier: staging
    url: https://m7nki-xaaaa-aaaan-qmlwa-cai.icp0.io/
    action: start

ogy dashboard production:
  stage: deploy
  interruptible: false
  resource_group: frontend production deployment
  variables:
    CANISTER_NAME: "ogy_dashboard"
  rules:
    - if: $CI_COMMIT_TAG =~ '/^ogy_dashboard-v\d+\.\d+\.\d+$/'
      needs: ["ogy_dashboard production build"]
      variables:
        TARGET_NETWORK: ic
        PEM_FILE: "${PEM_FILE_PRODUCTION}"
  before_script:
    - !reference [.import dfx identity, before_script]
  script:
    - !reference [.asset canister production deploy, script]
  environment:
    name: production/ogy_dashboard
    deployment_tier: production
    url: https://jbj2y-2qaaa-aaaal-ajc5q-cai.icp0.io/
    action: start

ogy landing page staging:
  stage: deploy
  interruptible: false
  resource_group: frontend staging deployment
  variables:
    CANISTER_NAME: "origyn_landing_page"
  rules:
    - if: $CI_COMMIT_REF_NAME == "develop" && $CI_PIPELINE_SOURCE != "merge_request_event"
      changes:
        - "frontend/origyn_landing_page/**/*"
        - "package.json"
        - "package-lock.json"
