      src-folder: gldt_swap
  # Deployments
  - local: scripts/ci-cd/.dfx_templates.yml

################################################################################
# Release tags
################################################################################
# Fails a release pipeline whose tag is not on master before anything is built
# or deployed: every other job of a tag pipeline waits for this stage, directly
# or through its "needs". This catches a tag put on the wrong commit. It does
# not stop someone who may create release tags and edits this file; the
# protected tag rules in the GitLab settings are there for that.
release tag is on master:
  stage: preparation
  image: node:24.22.1 # any image that has git
  before_script:
    - git --version
  rules:
    - if: $CI_COMMIT_TAG =~ '/^[a-zA-Z0-9_]+-v\d+\.\d+\.\d+(-reinstall)?$/'
    # A change to this file is tried on its merge request. Without a tag the
    # job only reports and never fails.
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes:
        - ".gitlab-ci.yml"
  script:
    - git fetch --quiet origin "+refs/heads/master:refs/remotes/origin/master"
    - |
      if git merge-base --is-ancestor "$CI_COMMIT_SHA" origin/master; then
        echo "$CI_COMMIT_SHORT_SHA is on master."
      elif [ -z "$CI_COMMIT_TAG" ]; then
        echo "$CI_COMMIT_SHORT_SHA is not on master. There is no tag, this is the trial run on a merge request."
      else
        echo "$CI_COMMIT_TAG points to $CI_COMMIT_SHORT_SHA, which is not on master."
        echo "Release tags belong on a commit of master: delete the tag and create it there."
        exit 1
      fi

################################################################################
# Linters
################################################################################

rust lint:
  stage: lint
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes:
        - "Cargo.{lock,toml}"
        - "backend/{**,**/**,**/**/**}/*.{rs,toml,lock}"
    - if: $CI_COMMIT_REF_NAME == "develop"
      changes:
        - "Cargo.{lock,toml}"
        - "backend/{**,**/**,**/**/**}/*.{rs,toml,lock}"
  extends: .rust template
  script:
    - cargo clippy

#######
# DEPLOYMENTS FRONTEND
#######
# The production jobs have no "changes" list: GitLab evaluates "changes" to
# true on every tag pipeline, so it never filtered anything there.
#
# Every deploy job, frontend or backend, has an environment of its own named
# "<tier>/<canister>" (staging/, preprod/, production/). The production key and
# proposer neuron (PEM_FILE_PRODUCTION, SNS_PROPOSER_NEURON_ID_PRODUCTION) can
# then be limited to the environment scope "production/*" in the GitLab
# settings, so only the production deploy jobs receive them. Build jobs must
# keep environment names outside "production/".

ogy dashboard staging:
  stage: deploy
  interruptible: false
  resource_group: frontend staging deployment
  variables:
    CANISTER_NAME: "ogy_dashboard"
  rules:
    - if: $CI_COMMIT_REF_NAME == "develop" && $CI_PIPELINE_SOURCE != "merge_request_event"
      changes:
        - "frontend/ogy_dashboard/**/*"
        - "package.json"
        - "package-lock.json"
        - ".npmrc"
      needs: ["ogy_dashboard staging build"]
      variables:
        TARGET_NETWORK: staging
        PEM_FILE: "${PEM_FILE_STAGING}"
  before_script:
    - !reference [.import dfx identity, before_script]
  script:
    - !reference [.asset canister staging deploy, script]
  environment:
    name: staging/ogy_dashboard
    deployment_tier: staging
    url: https://7ekbt-siaaa-aaaag-ak64a-cai.icp0.io/
    action: start

ogy dashboard preprod:
  stage: deploy
  interruptible: false
  resource_group: frontend staging deployment
  variables:
    CANISTER_NAME: "ogy_dashboard"
  rules:
    - if: $CI_COMMIT_REF_NAME == "develop" && $CI_PIPELINE_SOURCE != "merge_request_event"
      changes:
        - "frontend/ogy_dashboard/**/*"
        - "package.json"
        - "package-lock.json"
        - ".npmrc"
      needs: ["ogy_dashboard preprod build"]
      variables:
        TARGET_NETWORK: preprod
        PEM_FILE: "${PEM_FILE_STAGING}"
  before_script:
    - !reference [.import dfx identity, before_script]
  script:
    - !reference [.asset canister preprod deploy, script]
  environment:
    name: preprod/ogy_dashboard
    deployment_tier: staging
    url: https://m7nki-xaaaa-aaaan-qmlwa-cai.icp0.io/
    action: start

# The production dashboard is governed by the ORIGYN SNS. This job does not put
# a new version live: it uploads the build to the asset canister as a proposed
# batch and submits the SNS proposal that commits it. The version goes live
# when the proposal is adopted.
ogy dashboard production:
  stage: deploy
  interruptible: false
  resource_group: frontend production deployment
  variables:
    CANISTER_NAME: "ogy_dashboard"
  rules:
    - if: $CI_COMMIT_TAG =~ '/^ogy_dashboard-v\d+\.\d+\.\d+$/'
      needs: ["ogy_dashboard production build"]
      variables:
        TARGET_NETWORK: ic
        PEM_FILE: "${PEM_FILE_PRODUCTION}"
      when: manual
  before_script:
    - !reference [.import dfx identity, before_script]
    - !reference [.include didc, before_script]
  script:
    - . scripts/frontend-deploy/sns_frontend_deploy.sh $CANISTER_NAME $TARGET_NETWORK
  environment:
    name: production/ogy_dashboard
    deployment_tier: production
    url: https://jbj2y-2qaaa-aaaal-ajc5q-cai.icp0.io/
    action: start

