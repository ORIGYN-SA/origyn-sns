  - local: scripts/ci-cd/.canister_builds.yml
    inputs:
      src-folder: sns_rewards
  - local: scripts/ci-cd/.canister_builds.yml
    inputs:
      src-folder: collection_index
  - local: scripts/ci-cd/.canister_builds.yml
    inputs:
      src-folder: sns_neuron_controller
  - local: scripts/ci-cd/.canister_builds.yml
    inputs:
      src-folder: buyback_burn
  # - local: scripts/ci-cd/.canister_builds.yml
