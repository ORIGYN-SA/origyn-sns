[workspace]
members = [
  "backend/canisters/buyback_burn/api",
  "backend/canisters/buyback_burn/impl",
  "backend/canisters/canister_jobs/api",
  "backend/canisters/canister_jobs/impl",
  "backend/canisters/collection_index/api",
  "backend/canisters/collection_index/impl",
  "backend/external_canisters/sns_governance/api",
  "backend/external_canisters/sns_governance/c2c_client",
  "backend/canisters/ogy_token_swap/impl",
  "backend/canisters/ogy_token_swap/api",
  "backend/canisters/sns_neuron_controller/api",
  "backend/canisters/sns_neuron_controller/impl",
  "backend/canisters/sns_rewards/impl",
  "backend/canisters/sns_rewards/api",
  "backend/external_canisters/icrc_ledger/api",
  "backend/external_canisters/icrc_ledger/c2c_client",
  "backend/external_canisters/ogy_legacy_ledger/api",
  "backend/external_canisters/ogy_legacy_ledger/c2c_client",
  "backend/external_canisters/origyn_nft_reference/api",
  "backend/external_canisters/origyn_nft_reference/c2c_client",
  "backend/integration_tests",
  "backend/libraries/candid_gen",
  "backend/libraries/http_request",
  "backend/libraries/types",
  "backend/libraries/utils",
]
resolver = "2"

[profile.release]
lto = "thin"
panic = "abort"

[workspace.dependencies]
assert_matches = "1.5.0"
candid = { version = "0.10", features = ["value"] }
ciborium = "0.2.2"
futures = "0.3.29"
# Enable `custom` feature of k256's getrandom dependency. See icp_neuron/impl/src/ecdsa.rs for more details.
getrandom = { version = "0.2.12", features = ["custom"] }
hex = "0.4.3"
ic-cdk = "0.20"
ic-cdk-macros = "0.20"
ic-cdk-timers = "1.0"
ic-ledger-types = "0.16"
ic-metrics-encoder = "1.1.1"
ic-stable-structures = "0.7"
ic-transport-types = "0.41.0"
ic-xrc-types = "1.2.0"
ic0 = "1.0.0"
icrc-ledger-types = "0.1.6"
k256 = "0.13.1"
minicbor = { version = "1.0.0", features = ["alloc", "derive"] }

proc-macro2 = "1.0.78"
quote = "1.0.33"
rmp-serde = "1.1.2"
rust_decimal = "1.36.0"
scopeguard = "1.2.0"
serde = "1.0.196"
serde_bytes = "0.11.12"
serde_cbor = "0.11.2"
serde_json = "1.0.108"
serde_with = "3.7.0"
serde_yaml = "0.9.29"
serde_tokenstream = "0.2.0"
sha2 = "0.10.8"
syn = { version = "2.0.99", features = ["full"] }
tracing = "0.1.40"
tracing-attributes = "0.1.27"
tracing-subscriber = "0.3.18"
num-bigint = { version = "0.4.4"}
time = { version = "0.3.36", features = [
  "macros",
  "serde",
  "parsing",
  "formatting",
] }
pocket-ic = "12.0"
async-trait = "0.1.89"
enum_dispatch = "0.3.13"
typetag = "0.2.18"
num-traits = "0.2.19"
thiserror = "2.0.12"
strum = { version = "0.27.2", features = ["derive"] }
strum_macros = "0.27.2"
lazy_static = "1.4.0"
anyhow = "1.0.99"

# Bity crates
bity-ic-icrc3 = { version =  "0.4.7" } # , features = ["debug-logs"]
bity-ic-icrc3-macros = "0.3.3"
bity-ic-canister-time = "0.3.0"
bity-ic-serializer = "0.1.0"
bity-ic-canister-client = "0.3"
bity-ic-canister-logger = "0.3"
bity-ic-canister-state-macros = "0.1.0"
bity-ic-canister-tracing-macros = "0.1.0"
bity-ic-stable-memory = "0.3"
bity-ic-types = "0.1.0"
bity-ic-utils = "0.3"
bity-ic-subcanister-manager = "0.3.0"
bity-ic-icrc3-archive-api = "0.3.0"
bity-ic-icrc3-archive-c2c-client = "0.3.0"
bity-ic-candid-gen = "0.1.0"
bity-ic-ledger-utils = "0.3"
bity-ic-icrc3-c2c-client = "0.1.0"