[profile.default]
src = "src"
test = "test"
script = "script"
out = "out"
libs = ["node_modules"]
auto_detect_remappings = false
solc = "0.8.28"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
# No metadata hash, so the same source always gives the same code hash (upgradeExact).
bytecode_hash = "none"
fs_permissions = [
    { access = "read", path = "./test" },
    { access = "read", path = "./script/config" },
    { access = "read-write", path = "./deployments" },
]
