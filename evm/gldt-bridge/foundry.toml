[profile.default]
src = "src"
test = "test"
script = "script"
out = "out"
libs = ["node_modules"]
auto_detect_remappings = false
solc = "0.8.28"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
# The IR pipeline keeps GLDT under the EIP-170 limit of 24,576 bytes (the legacy pipeline is about 25,200).
via_ir = true
# No metadata hash, so the same source always gives the same code hash (upgradeExact).
bytecode_hash = "none"
# OpenZeppelin Foundry Upgrades runs its upgrade safety check (the upgrades-core CLI) through ffi,
# reading the AST, build info and storage layout from ./out.
ffi = true
ast = true
build_info = true
extra_output = ["storageLayout"]
fs_permissions = [
    { access = "read", path = "./out" },
    { access = "read", path = "./test" },
    { access = "read", path = "./script/config" },
    { access = "read-write", path = "./deployments" },
]
